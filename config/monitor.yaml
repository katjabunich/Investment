# config/monitor.yaml
#
# Конфигурация «советника по просадкам» (tools/monitor.py).
#
# Идея: вы регулярно инвестируете фиксированную сумму (месячный взнос) в
# индексный инструмент. При просадке рынка от исторического максимума
# советник предлагает докупить на несколько взносов сверх плана из
# заранее отложенного денежного резерва (cash_reserve).
#
# Файлы серий (CSV) должны иметь тот же формат, что создаёт tools/fetch_data.py:
#   date,close
#   2024-01-31,123.45
#   2024-02-29,120.10
#   ...
# Частота может быть дневной или месячной — скрипт работает с датами как есть.

# Список отслеживаемых серий. Можно добавить сколько угодно инструментов.
series:
  - name: msci_world
    # Путь к CSV-файлу с историей котировок (создаётся tools/fetch_data.py).
    file: data/msci_world.csv
    # Ваш обычный ежемесячный взнос в этот инструмент, в валюте currency.
    # По умолчанию согласовано с monthly_contribution из config/portfolio.yaml.
    monthly_contribution: 1000
    # Сколько кэша сейчас отложено специально под докупки на просадках.
    # Используется только для информации в выводе (не блокирует сигнал).
    cash_reserve: 3000

  # Пример второй серии — раскомментируйте и настройте при необходимости.
  # - name: sp500
  #   file: data/sp500.csv
  #   monthly_contribution: 200
  #   cash_reserve: 1500

# Валюта для отображения сумм.
currency: EUR

# Пороги траншей докупки. drawdown — просадка в процентах от исторического
# максимума (отрицательное число), installments — сколько месячных взносов
# докупить сверх плана при активации этого транша (не накопительно —
# это отдельная докупка именно на этом уровне).
# Список должен быть отсортирован по возрастанию глубины (от -10% к -30% и глубже).
tranches:
  - drawdown: -10
    installments: 1
  - drawdown: -20
    installments: 2
  - drawdown: -30
    installments: 3

# Журнал уже сделанных докупок на просадках (создаётся и обновляется
# автоматически флагом --log-purchase). Формат: date,series,drawdown_level,amount
purchase_log: data/dip_purchases.csv

# Порог (в процентах), начиная с которого просадка считается «значимым
# эпизодом» для исторической статистики (топ-5 худших просадок).
episode_min_depth: -10
