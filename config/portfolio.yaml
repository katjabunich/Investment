# ============================================================================
# Конфигурация портфеля для долгосрочного прогноза капитала
# ============================================================================
# Файл читают инструменты tools/forecast.py и tools/fetch_data.py.
# Все параметры можно свободно менять под свою ситуацию.
# ----------------------------------------------------------------------------

# Базовая валюта расчётов. Итоговый капитал будет показан в этой валюте.
base_currency: EUR

# Текущая стоимость уже вложенного портфеля (сколько денег работает сейчас).
current_value: 187480

# Ежемесячный взнос.
monthly_contribution: 2700

# Ежегодная индексация взносов (рост суммы взноса каждый год).
# 0.02 = взнос растёт на 2% в год (например, вслед за ростом дохода/инфляции).
annual_contribution_growth: 0.02

# Горизонт прогноза в годах. Можно переопределить флагом --years в forecast.py.
horizon_years: 20

# Ожидаемая среднегодовая инфляция. Используется для перевода номинального
# капитала в «реальный» (сегодняшняя покупательная способность).
inflation: 0.025

# ----------------------------------------------------------------------------
# Нидерландский налог на капитал Box 3 (vermogensrendementsheffing).
# Моделируются ТОЛЬКО личные активы пользовательницы с её персональной льготой
# (фискальный партнёр не учитывается). Налог вычитается из портфеля в конце
# каждого симуляционного года и уменьшает базу для дальнейшего роста.
#
# Два режима:
#   * ТЕКУЩИЙ (по 2027 включительно): налог со «вменённой» доходности
#     deemed_return от капитала выше льготы, ставка tax_rate. При tegenbewijs
#     (правило встречного доказательства) — если ФАКТИЧЕСКАЯ доходность года
#     ниже вменённой, налог считается с фактической (но не ниже нуля).
#   * РЕФОРМА (с 2028, vermogensaanwasbelasting): налог reform_tax_rate с
#     фактического прироста стоимости за год (включая нереализованный) сверх
#     необлагаемого результата reform_tax_free_result. Убытки обнуляются
#     БЕЗ переноса на будущие годы (carry-forward не моделируется —
#     консервативное упрощение, налог может быть слегка завышен).
#
# Статус реформы на июль 2026: принята Второй палатой, в Первой отложена —
# параметры могут измениться. model_reform=false моделирует сценарий «реформу
# отложат» — тогда текущий вменённый режим действует весь горизонт.
# ----------------------------------------------------------------------------
box3:
  enabled: true
  first_tax_year: 2027            # первый полный год налога в симуляции (симуляция стартует середина 2026)
  tax_free_allowance: 59357       # личный heffingsvrij vermogen, 2026 (€)
  allowance_growth: 0.02          # индексация льготы ~2%/год
  deemed_return: 0.06             # вменённая доходность инвестиций (текущий режим)
  tax_rate: 0.36                  # ставка налога (текущий режим)
  tegenbewijs: true               # применять правило встречного доказательства
  reform_start_year: 2028         # первый год действия реформы
  reform_tax_rate: 0.36           # ставка налога на прирост (реформа)
  reform_tax_free_result: 1800    # необлагаемый результат за год (€, реформа)
  model_reform: true              # false = текущий режим навсегда (сценарий «реформу отложат»)

# ----------------------------------------------------------------------------
# FIRE-калькулятор (tools/fire.py): «когда можно перестать полноценно работать».
# Coast/Barista FIRE — перебор года перехода: до него вносятся взносы, после —
# начинаются изъятия на жизнь. Расходы и подработка заданы в СЕГОДНЯШНИХ ценах
# (изъятия индексируются инфляцией, реальная величина постоянна).
# ----------------------------------------------------------------------------
fire:
  current_age: 36                 # текущий возраст (лет)
  life_expectancy: 95             # горизонт дожития (до скольки лет считаем)
  expenses_scenarios: [2000, 2500, 3000]  # сценарии расходов, €/мес (сегодня)
  success_threshold: 0.85         # порог вероятности успеха (портфель > 0 до конца)

  # Доходы свободной фазы. Вычитаются из ежемесячного изъятия (уменьшают нагрузку
  # на ликвидное ведро). Заданы в СЕГОДНЯШНИХ ценах, НЕТТО (без налога), каждый
  # поток длится до своего until_age. Подработка теперь — один из потоков (раньше
  # был отдельный параметр part_time_income; чтобы не задвоить — он удалён).
  side_income:
    - {name: подработка, monthly: 1000, until_age: 60}
    - {name: канал, monthly: 300, until_age: 60}      # требует ведения; консервативно до 60
    - {name: аренда квартиры, monthly: 200, until_age: 95}

  # Государственная пенсия AOW. Начинается в start_age, нетто, сегодняшние цены.
  # enabled=false возвращает «старую» модель (только ликвидное ведро + подработка).
  aow:
    enabled: true
    start_age: 68
    monthly_amount: 1580          # нетто, сегодняшние цены (одинокая, 2026)
    fraction: 0.8                 # доля полной AOW (иммигрантка: −2% за каждый год отсутствия в NL в 15-67; 0.8 — оценка, уточнить на mijnsvb.nl)

  # Пенсионное ведро lijfrente (ZZP). enabled здесь — база; в прогонах сценарий B
  # включает его принудительно, сценарий A — выключает.
  lijfrente:
    enabled: false                # включается в сценарии B
    monthly_contribution: 1000    # взнос в lijfrente, €/мес (сегодня)
    tax_refund_rate: 0.3756       # возврат налога, докладывается в ликвидное ведро
    payout_tax_rate: 0.22         # средний налог на выплаты после 68
    payout_end_age: 95            # аннуитет 68..payout_end_age (реальная ставка 1,5%)

# ----------------------------------------------------------------------------
# Соответствие «прокси-серия -> символ для загрузки котировок».
# Используется скриптом fetch_data.py. Ключ — имя серии (как в holdings.proxy),
# значение — символ на Stooq (приоритет) или тикер для yfinance-фолбэка.
# У Stooq нет прямых индексов MSCI, поэтому для них берём торгуемые ETF-прокси
# с самой длинной историей.
# ----------------------------------------------------------------------------
data_sources:
  sp500:
    stooq: ^spx           # индекс S&P 500, история с 1789 (реально с ~1928)
    yf: ^GSPC
  nasdaq100:
    stooq: ^ndx           # индекс Nasdaq-100, история с 1985
    yf: ^NDX
  world_ex_us:
    stooq: EFA.US         # iShares MSCI EAFE ETF (развитые рынки без США), с 2001
    yf: VEU               # Vanguard FTSE All-World ex-US как альтернатива
  em:
    stooq: EEM.US         # iShares MSCI Emerging Markets ETF, с 2003
    yf: EEM
  small_value:
    stooq: IWN.US         # iShares Russell 2000 Value ETF (США, малые недооценённые), с 2000
    yf: IWN               # сам AVWS слишком молод (2019) для длинной истории

# ----------------------------------------------------------------------------
# Состав портфеля. Веса нормируются автоматически (могут не давать ровно 1.0).
# proxy — имя исторической серии, по которой берём доходность позиции
# (см. data_sources выше и файлы в data/).
#
# Целевое соотношение: 45 / 25 / 10 / 10 / 10 = 100%.
# ----------------------------------------------------------------------------
holdings:
  - ticker: SXR8
    name: iShares Core S&P 500 UCITS ETF (Acc)
    weight: 0.45
    proxy: sp500

  - ticker: EXUS
    name: Xtrackers MSCI World ex USA UCITS ETF (Acc)
    weight: 0.25
    proxy: world_ex_us

  - ticker: EIMI
    name: iShares Core MSCI EM IMI UCITS ETF (Acc)
    weight: 0.10
    proxy: em

  - ticker: EQQB
    name: Invesco Nasdaq-100 UCITS ETF (Acc)
    weight: 0.10
    proxy: nasdaq100

  - ticker: AVWS
    name: Avantis Global Small Cap Value UCITS ETF (Acc)
    weight: 0.10
    proxy: small_value    # исторический прокси: малые недооценённые компании США
