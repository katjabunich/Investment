# ============================================================================
# Конфигурация портфеля для долгосрочного прогноза капитала
# ============================================================================
# Файл читают инструменты tools/forecast.py и tools/fetch_data.py.
# Все параметры можно свободно менять под свою ситуацию.
# ----------------------------------------------------------------------------

# Базовая валюта расчётов. Итоговый капитал будет показан в этой валюте.
base_currency: EUR

# Текущая стоимость уже вложенного портфеля (сколько денег работает сейчас).
current_value: 187480

# Ежемесячный взнос.
monthly_contribution: 2700

# Ежегодная индексация взносов (рост суммы взноса каждый год).
# 0.02 = взнос растёт на 2% в год (например, вслед за ростом дохода/инфляции).
annual_contribution_growth: 0.02

# Горизонт прогноза в годах. Можно переопределить флагом --years в forecast.py.
horizon_years: 20

# Ожидаемая среднегодовая инфляция. Используется для перевода номинального
# капитала в «реальный» (сегодняшняя покупательная способность).
inflation: 0.025

# ----------------------------------------------------------------------------
# Соответствие «прокси-серия -> символ для загрузки котировок».
# Используется скриптом fetch_data.py. Ключ — имя серии (как в holdings.proxy),
# значение — символ на Stooq (приоритет) или тикер для yfinance-фолбэка.
# У Stooq нет прямых индексов MSCI, поэтому для них берём торгуемые ETF-прокси
# с самой длинной историей.
# ----------------------------------------------------------------------------
data_sources:
  sp500:
    stooq: ^spx           # индекс S&P 500, история с 1789 (реально с ~1928)
    yf: ^GSPC
  nasdaq100:
    stooq: ^ndx           # индекс Nasdaq-100, история с 1985
    yf: ^NDX
  world_ex_us:
    stooq: EFA.US         # iShares MSCI EAFE ETF (развитые рынки без США), с 2001
    yf: VEU               # Vanguard FTSE All-World ex-US как альтернатива
  em:
    stooq: EEM.US         # iShares MSCI Emerging Markets ETF, с 2003
    yf: EEM
  small_value:
    stooq: IWN.US         # iShares Russell 2000 Value ETF (США, малые недооценённые), с 2000
    yf: IWN               # сам AVWS слишком молод (2019) для длинной истории

# ----------------------------------------------------------------------------
# Состав портфеля. Веса нормируются автоматически (могут не давать ровно 1.0).
# proxy — имя исторической серии, по которой берём доходность позиции
# (см. data_sources выше и файлы в data/).
#
# Целевое соотношение: 45 / 25 / 10 / 10 / 10 = 100%.
# ----------------------------------------------------------------------------
holdings:
  - ticker: SXR8
    name: iShares Core S&P 500 UCITS ETF (Acc)
    weight: 0.45
    proxy: sp500

  - ticker: EXUS
    name: Xtrackers MSCI World ex USA UCITS ETF (Acc)
    weight: 0.25
    proxy: world_ex_us

  - ticker: EIMI
    name: iShares Core MSCI EM IMI UCITS ETF (Acc)
    weight: 0.10
    proxy: em

  - ticker: EQQB
    name: Invesco Nasdaq-100 UCITS ETF (Acc)
    weight: 0.10
    proxy: nasdaq100

  - ticker: AVWS
    name: Avantis Global Small Cap Value UCITS ETF (Acc)
    weight: 0.10
    proxy: small_value    # исторический прокси: малые недооценённые компании США
