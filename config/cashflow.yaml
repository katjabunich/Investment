# ============================================================================
# Конфигурация денежного потока (доходы/расходы) для советника по взносам
# ============================================================================
# Файл читает tools/cashflow.py и на основе этих данных считает свободный
# денежный поток, норму сбережений, заполненность подушки безопасности и
# выдаёт рекомендацию по ежемесячному инвестиционному взносу.
#
# Заполнено по данным владелицы 05.07.2026. Правьте цифры прямо здесь —
# это «единственный источник правды» по доходам и расходам.
# Для быстрой прикидки без правки файла: tools/cashflow.py --income X --expenses Y
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# ДОХОДЫ (чистыми, в месяц).
#
# ИЗМЕРЕНО по выписке второго счёта за август 2025 – июль 2026.
# Клиент OMI EASTERN EUROPE платит дважды в месяц, 1-го и 15-го:
#   2025 год          2 700 x 2 = 5 400/мес
#   с февраля 2026    3 500 x 2 = 7 000/мес
# Плюс доплаты, компенсирующие разницу с фактически уплаченными налогами:
#   30.12.2025  +6 455 · 09.07.2026  +7 633
# ИТОГО за 12 месяцев: 99 936 EUR валовых = 8 328/мес.
#
# Реконструкция чистого дохода:
#   валовая выручка OMI                    99 936
#   − деловые расходы                      −4 024
#     (голландский 2 353, Jortt 424, хостинг 33, Anthropic + Lenny's 1 425)
#   − налог (платёж Belastingdienst 06.2026) −24 152
#   = чистыми                              71 760/год = 5 980/мес
#   + канал 300 + аренда 200                = 6 480/мес
#
# ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ, поэтому в модели пока прежние 5 700:
#   1) весь ли доход от OMI или есть другие клиенты
#   2) 24 152 в июне — это весь налог за год или есть ещё voorlopige aanslag
#   3) Direct Savings (−15 000 в декабре, −14 900 в июне) — подушка
#      или резерв под налог? От этого зависит расчёт подушки безопасности.
# ----------------------------------------------------------------------------
monthly_income_net: 5700

# Стабильность дохода: ZZP — формально доход переменный (нет работодателя,
# больничных и отпускных), поэтому variable: советник держит буфер 20% вместо
# 10%. Если поток заказов годами стабилен, можно вернуть stable.
income_stability: variable

# ----------------------------------------------------------------------------
# РАСХОДЫ в месяц, по категориям (сумма считается автоматически).
# Жильё: за съём сейчас не платит, коммуналка входит в "еда и хозяйство" (600).
# Если ситуация изменится (аренда/ипотека) — добавьте строку "жильё: ...".
# ----------------------------------------------------------------------------
monthly_expenses:
  # ФАКТ по выпискам ABN AMRO + Wise за январь–июль 2026.
  #
  # База: 11 месяцев выписок — сентябрь–декабрь 2025 и январь–июль 2026.
  # Чистые расходы по ABN AMRO помесячно (после вычета компенсаций):
  #   2025: сен 1752 · окт 2425 · ноя 2604 · дек 2379
  #   2026: янв 2398 · фев 2003 · мар 1896 · апр 3307 · май 1888 ·
  #         июн 2261 · июл 1736   (компенсации разнесены поровну — помесячных
  #         данных по ним за 2026 нет, есть только среднее 572/мес)
  # Две независимые выборки сошлись: 2 290 (2025) против 2 213 (2026).
  #
  # Сборка итога, EUR/мес:
  #   среднее чистых по ABN AMRO за 11 мес    2 241
  #   − ZVW-взнос ZZP (компенсирует клиент)   −104
  #   + психолог (платится с другой карты)    +420
  #   + все траты по выписке Wise             +154  (см. ниже)
  #   − спорт: в 2025 было 220/мес (три клуба),  −49  сейчас 85, база
  #     завышена на 4 месяца 2025                     скорректирована вперёд
  #   − разовая медицина: анализ крови 637 +     −78  повторяться не будут
  #     УЗИ (EchoPlus) 216 = 853 за 4 мес
  #   + личные траты со второго счёта          +410  (см. ниже)
  #   ------------------------------------------------
  #                                          ≈2 578
  #
  # Проверка вторым способом: построчная разбивка сентября-декабря 2025
  # (единственный период с полной категоризацией) даёт 2 367 — там разовые
  # траты вычтены целиком, а не размазаны по 11 месяцам. Истина между:
  # рабочая цифра 2 500/мес, диапазон 2 370-2 580.
  # + партнёру теперь фиксировано 600/мес вместо измеренных 559 -> 2 540.
  #
  # Возврат от мамы — РАЗОВЫЙ: ~500 EUR один раз (половина расходов в Турции),
  # а не ежемесячный. На месячную норму не влияет.
  #
  # В базу НЕ входят: взносы в IBKR, переводы ABN -> Wise (иначе двойной счёт
  # с выпиской Wise), поступления "E BUNICH" (это перевод дохода с делового
  # счёта: 5 320/мес против заявленных 5 200 нетто — выписка подтверждает доход).
  #
  # Структура трат, ABN AMRO и Wise ВМЕСТЕ (магазины Wise разнесены
  # по обычным категориям, отдельной строки "Wise" нет), EUR/мес:
  #   партнёру 600 (фиксированная сумма, с 2026) · психолог 420
  #   медицина 133 регулярная (разовые исключены; см. ниже)
  #   одежда ~293 · красота и уход 285 · онлайн-покупки 211
  #   дом и обустройство 81 = РЕЗЕРВ (891 EUR за ноя-дек / 11 мес):
  #     шкаф 579 + кресло Beliani 180 + лампа 48 + растения 48 +
  #     Sostrene Grene 35. Редкое, но повторяемое -> оставлено резервом.
  #     Если обустройство закончено, можно снизить до 50 (итог 2 550).
  #   неопознанное ~85 (Alipay, Amazon, Temu — назначение неизвестно)
  #   отпуск и поездки 180 · страховки 166 (FBTO премия 158 + Unive 8)
  #   спорт 85 (в 2025 было 220 — три клуба, сокращено)
  #   подписки и софт 129 (Anthropic 90 + Lenny's 29 + Apple 8 + Telegram 2)
  #   кафе 77 · транспорт 48 · связь 34 · еда 30 · прочее 30
  #
  # ZVW-взнос ZZP (в выписке шёл как "муниципальные сборы" ~104/мес) —
  # его компенсирует клиент, это не расход владелицы. Из расходов убран.
  #
  # ПОДПИСКИ. Anthropic + Lenny's (119/мес) — профессиональные инструменты,
  # проводятся деловыми расходами ZZP, возврат ~40% = ~570 EUR/год.
  # Нулевые списания-проверки (DeepL, ElevenLabs, Supabase, Mobbin, Wispr,
  # Google) владелица отменяет — в расходы не заложены.
  #
  # МЕДИЦИНА. Нерегулярные списания FBTO — это анализы и процедуры, а не
  # страховка (страховка = ровно 158,35 первого числа). MijnPil возвращается
  # по страховке: списания 2 x 49,95 и возвраты FBTO 2 x 49,95 уже
  # взаимозачтены, в итог не входят. EchoPlus 216 EUR — это УЗИ, тоже медицина
  # (раньше ошибочно отнесла к мебели). Медицина за сентябрь-декабрь 2025 =
  # 1 385 EUR за 4 мес = 346/мес, из них РАЗОВЫХ 853 (Bloedwaardentest 637 +
  # УЗИ 216) — владелица подтвердила, что повторяться не будут.
  # Регулярная медицина = 133/мес (аптеки, Infomedics, MedPrestige, FBTO).
  # Прежняя оценка 43 была занижена втрое.
  #
  # ВНИМАНИЕ: за 11 месяцев случилось ДВА разовых медицинских события на
  # 853 EUR. Закладывать в будущее ровно ноль — оптимистично. Разумно либо
  # держать резерв ~40/мес, либо покрывать такие вещи из подушки (20 000 EUR
  # это позволяет). Обязательный eigen risico 385 EUR/год = 32/мес выбирается
  # практически всегда и уже сидит в регулярных 133.
  # Практический вывод: добровольную франшизу не брать.
  #
  # СПОРТ. В 2025 работали три абонемента: Club Pellikaan 108,67/мес,
  # bbb healthclub (110 и 149), BOB Tennis Padel 318, BSPORT 89 — в сумме
  # 220/мес за сентябрь-декабрь. Сейчас остался один клуб за 85/мес.
  # Сокращение уже сделано, поэтому итог скорректирован вперёд на -49/мес.
  #
  # ДОМ И МЕБЕЛЬ — оценка низкой точности. Уверенно опознаны: Meubella 579,
  # Beliani 180, lampenlicht 48, Sostrene Grene 35, AVRI 48 = 891 EUR за
  # ноябрь-декабрь (~180/мес по периоду сен-дек). Ещё EchoPlus 216 и
  # маркетплейсы (Alipay, Amazon, Temu) на 423 EUR — назначение неизвестно,
  # в статью НЕ отнесены. EchoPlus опознан как УЗИ и перенесён в медицину.
  #
  # ОДЕЖДА ~293/мес против прежних 150 (Zalando нетто 1 465 за 5 месяцев).
  total: 2950

