# ============================================================================
# Конфигурация денежного потока (доходы/расходы) для советника по взносам
# ============================================================================
# Файл читает tools/cashflow.py и на основе этих данных считает свободный
# денежный поток, норму сбережений, заполненность подушки безопасности и
# выдаёт рекомендацию по ежемесячному инвестиционному взносу.
#
# Заполнено по данным владелицы 05.07.2026. Правьте цифры прямо здесь —
# это «единственный источник правды» по доходам и расходам.
# Для быстрой прикидки без правки файла: tools/cashflow.py --income X --expenses Y
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# ДОХОДЫ (чистыми, в месяц).
#
# ИЗМЕРЕНО по выписке второго счёта за август 2025 – июль 2026.
# Клиент OMI EASTERN EUROPE платит дважды в месяц, 1-го и 15-го:
#   2025 год          2 700 x 2 = 5 400/мес
#   с февраля 2026    3 500 x 2 = 7 000/мес
# Плюс доплаты, компенсирующие разницу с фактически уплаченными налогами:
#   30.12.2025  +6 455 · 09.07.2026  +7 633
# ИТОГО за 12 месяцев: 99 936 EUR валовых = 8 328/мес.
#
# Реконструкция чистого дохода:
#   валовая выручка OMI                    99 936
#   − деловые расходы                      −4 024
#     (голландский 2 353, Jortt 424, хостинг 33, Anthropic + Lenny's 1 425)
#   − налог (платёж Belastingdienst 06.2026) −24 152
#   = чистыми                              71 760/год = 5 980/мес
#   + канал 300 + аренда 200                = 6 480/мес
#
# Разовые поступления, в регулярный доход НЕ входят:
#   Stichting Mollie +1 200 (29.09.25) — возврат за планшет, не доход
#   Alexandra Schneider +385 (22.07.25) — разовый коучинг, больше не ведётся
#
# Счёт формально деловой (ZZP), но используется и как личный: с него идут
# и деловые расходы, и часть личных трат, и переводы на личный счёт.
#
# Платёж 24 152 подтверждён по выписке: 17.06.2026 двумя суммами,
# Belastingdienst −20 677 и −3 475.
#
# ВНИМАНИЕ: платёж 24 152 в июне 2026 — это налог за КАЛЕНДАРНЫЙ 2025 год,
# когда OMI платил 5 400/мес. Доход 2025 = 5 400 x 12 + доплата 6 455
# = 71 255, эффективная ставка 33,9%.
#
# В 2026 ставка OMI выросла до 7 000/мес. Доход 2026 ~90 300 (+27%).
# Налог за 2026, к уплате примерно в июне 2027:
#   при той же ставке 34%          ~30 600
#   с учётом прогрессии 37%        ~33 400
#   консервативно 39%              ~35 200
# Берём центральную оценку 32 000.
#
# СТРУКТУРА ВЫПЛАТ OMI — три разных потока:
#
# 1) РЕГУЛЯРНЫЕ, дважды в месяц (1-го и 15-го), С НАЛОГАМИ ВНУТРИ:
#      2025 год        2 700 x 2 = 5 400/мес
#      с февраля 2026  3 500 x 2 = 7 000/мес = 84 000/год
#    Отдельные платежи бывают с копейками (16.01.26  2 985,
#    16.03.26  3 554) — это те же регулярные, с корректировкой.
#
# 2) ПРЕМИИ — ЧЕТЫРЕ РАЗА В ГОД, в конце квартала, ОТДЕЛЬНЫМ платежом:
#      30.09.2025  3 930  (Q3 2025)
#      30.12.2025  6 455  (Q4 2025)
#      30.03.2026  2 967  (Q1 2026)
#      29.06.2026  5 012  (Q2 2026)
#    среднее 4 591. В каждый из этих дней есть И обычный платёж — значит
#    это самостоятельная премия, а не увеличенная выплата.
#
# 3) КОМПЕНСАЦИЯ НАЛОГОВ — раз в год, июнь-июль:
#      09.07.2026  7 633
#
# ГОД ВПЕРЁД: регулярные 3 500 x2 = 84 000 плюс премии и доплаты.
# Прибыль = валовые − деловые расходы 11 435 (включая психолога 7 200).
#
#  премии+доплаты | валовые | прибыль | налог  | эфф. | чистыми | свободных
#  ---------------|---------|---------|--------|------|---------|----------
#   10 000        |  94 000 |  82 565 | 28 059 | 30%  |  5 660  |  2 810
#   16 000        | 100 000 |  88 565 | 30 023 | 30%  |  5 996  |  3 146
#   32 536 (факт) | 116 536 | 105 101 | 36 969 | 32%  |  6 795  |  3 945
#
# ВАЖНО: при прибыли выше ~90 000 налогооблагаемая база переваливает
# за 76 817 и каждый следующий евро облагается по 49,5%. Это резко
# повышает ценность lijfrente — вычет там же, на верхней ставке.
#
# ПОСЧИТАНО по шкале: tools/tax_zzp.py --revenue 105236 --expenses 11435
#   ВЫРУЧКА 2026:
#     регулярные (3 500 x 2, с поправкой на январь-февраль)   ~84 000
#     премии Q1 2 967 + Q2 5 012 (факт)                         7 979
#     премии Q3 и Q4 (оценка по 2025: 3 930 и 6 455)           10 385
#     компенсация налогов 09.07                                 7 633
#     ---------------------------------------------------------------
#     ИТОГО (сходится с фактом янв-июл 59 851 + прогноз)      105 236
#   − деловые расходы (вкл. психолога 7 200)                  −11 435
#   = прибыль                                                  93 801
#   − zelfstandigenaftrek 1 200 и MKB 12,7 %                  −13 
#   = база                                                     80 841
#   подоходный 26 906 (после arbeidskorting 2 937)
#   + ZVW 4 050
#   ВСЕГО НАЛОГОВ 30 957, эффективная ставка 29,4 % от выручки
#
# !!! БАЗА 80 841 ВЫШЕ ПОРОГА 79 137 -> предельная ставка 49,5 %.
# Каждый следующий евро прибыли облагается по верхней ставке, и каждый
# евро вычета (деловые расходы, KIA, lijfrente) экономит 49,5 %, а не 37,6 %.
#
# ВАЖНО про психолога. Для НАЛОГА он вычитается как деловой расход (входит
# в 11 435). Но в личных расходах он тоже стоит — 600/мес. Вычитать его
# дважды нельзя, поэтому из дохода вычитаются деловые расходы БЕЗ него:
#   выручка 105 236 − налог 30 957 − деловые без психолога 4 235
#   = 70 044/год = 5 837/мес + канал и аренда 500 = 6 337/мес
#
# Из платежа 09.07.2026 (7 633) компенсируются налоги, остальное сверх
# обычных 2 700/3 500 — премии. Для налога разницы нет: всё это выручка.
#
# Бухгалтера нет, декларацию владелица делает сама.
# Аванс помесячно НЕ платится — налог уходит одним платежом в июне.
#
# ОБЯЗАТЕЛЬНО УТОЧНИТЬ у бухгалтера voorlopige aanslag за 2026 — без этой
# цифры нельзя решать ни по взносу, ни по lijfrente, ни по излишку подушки.
# ----------------------------------------------------------------------------
monthly_income_net: 6337

# Стабильность дохода: ZZP — формально доход переменный (нет работодателя,
# больничных и отпускных), поэтому variable: советник держит буфер 20% вместо
# 10%. Если поток заказов годами стабилен, можно вернуть stable.
income_stability: variable

# ----------------------------------------------------------------------------
# РАСХОДЫ в месяц, по категориям (сумма считается автоматически).
# Жильё: за съём сейчас не платит, коммуналка входит в "еда и хозяйство" (600).
# Если ситуация изменится (аренда/ипотека) — добавьте строку "жильё: ...".
# ----------------------------------------------------------------------------
monthly_expenses:
  # ============================================================================
  # ФАКТ по выпискам: ABN AMRO (личный и деловой счета) сентябрь 2025 – июль
  # 2026 и Wise май–июль 2026. Все транзакции разнесены построчно.
  # ============================================================================
  #
  # ВОЗВРАТЫ ОТНЕСЕНЫ К МЕСЯЦУ ПОКУПКИ, а не к месяцу поступления. Иначе
  # месяц с крупной покупкой выглядит катастрофой, а следующий — праздником.
  #
  #   месяц    по кассе   с возвратами
  #   сен 2025    1 752        2 192
  #   окт 2025    2 425        2 425
  #   ноя 2025    2 604        2 604
  #   дек 2025    2 379        2 379
  #   янв 2026    2 398        2 208
  #   фев 2026    2 003        2 193
  #   мар 2026    1 896        1 896
  #   апр 2026    3 388        2 630
  #   май 2026    1 888        2 646
  #   июн 2026    2 261        2 261
  #   июл 2026    1 736        1 736
  #   СРЕДНЕЕ     2 248        2 288
  #
  # Что перенесено (все три случая — Zalando, других межмесячных возвратов
  # в выписках нет):
  #   440,00  возвраты 05.09.25 за августовские покупки (август вне окна)
  #   189,90  возврат 23.02.26 за покупку 269,80 от 28.01.26
  #   758,12  возвраты 13.05–03.06.26 за покупки 985,67 и 664,28 от 29–30.04
  #
  # Проверено построчно: PayPal и FBTO тоже возвращают, но в пределах месяца
  # (PayPal −468,80 15.06 -> +468,80 23.06; MijnPil −49,95 -> FBTO +49,95).
  #
  # ----------------------------------------------------------------------------
  # СБОРКА ИТОГА, EUR/мес
  # ----------------------------------------------------------------------------
  #   среднее по ABN AMRO за 11 мес, возвраты по месяцу покупки   2 288
  #   + психолог Baryxus (2 400 x 3 раза в год, с делового счёта)  +600
  #   + траты по выписке Wise                                      +154
  #   + прочие личные траты с делового счёта                       +130
  #     (iBOOD нетто 764, PayPal 696, Nudient и Appelhoes 74, банк 23)
  #   + партнёру теперь фиксировано 600 вместо измеренных 559       +41
  #   − ZVW-взнос ZZP — компенсирует клиент                        −104
  #   − спорт: база несёт 220/мес за 4 месяца 2025, сейчас 85       −49
  #   − разовая медицина: анализ крови 637 + УЗИ 216 = 853         −78
  #   --------------------------------------------------------------------
  #   ИТОГО                                                       ≈2 980
  #
  # НЕ входят: взносы в IBKR, переводы между своими счетами (E BUNICH,
  # ABN -> Wise, Direct Savings), налоги.
  #
  # ----------------------------------------------------------------------------
  # СТРУКТУРА, EUR/мес (ABN AMRO и Wise вместе)
  # ----------------------------------------------------------------------------
  #   партнёру 600 · психолог 600 · PayPal (состав неизвестен) 361
  #   отпуск и поездки 300 · одежда 195 · страховки 166 · кафе 143
  #   красота и уход 140 · медицина 133 регулярная · подписки и софт 129
  #   спорт 85 · дом и обустройство 75 · транспорт и связь 55 · прочее 49
  #   минус возвраты через Tikkie
  #
  # ИСПРАВЛЕНО 02.08.2026, две категории были завышены:
  #   ОДЕЖДА была 293 -> 195. Прежняя цифра взята с периода самой крупной
  #     волны Zalando и растянута на год. По 11 месяцам: сен-дек 2025
  #     809,27 за 4 мес (202/мес), янв-июл 2026 нетто Zalando 971,73 плюс
  #     часть Vip District (191/мес). Среднее 195.
  #   ОТПУСК был 485 -> ~300. Ошибка грубее: Booking 936,32 (07.09.2025)
  #     посчитан целиком, хотя в тот же день Tikkie вернул 900 —
  #     владелица платила за компанию. Без него сен-дек 1 232,99 = 308/мес.
  #     В 2026 опознанных билетов только 432 за 7 мес (62/мес), остальное
  #     может сидеть в PayPal.
  #
  # PAYPAL 361/мес (2 530 за янв-июл 2026) — самая непрозрачная статья,
  # 4 300 EUR/год без детализации. Владелица уточнила: это НЕ только отели
  # и билеты, такое описание относилось только к маю.
  #
  # СТРУКТУРА ПО СМЫСЛУ:
  #   необязательное (одежда 195 + PayPal 361 + красота 140 + кафе 143)
  #     = 839/мес = 10 068/год = 28% всех расходов
  #   базовое (еда и коммуналка 600 + страховки 166 + медицина 133 +
  #     транспорт и связь 55) = 954/мес
  #   То есть на необязательное уходит почти столько же, сколько на всё
  #   необходимое вместе.
  #
  # ГЛАВНОЕ ОБСТОЯТЕЛЬСТВО: жильё не оплачивается. При типичных для NL
  # ~1 100/мес расходы были бы 4 080, а норма сбережений 36% вместо 53%.
  # Вся устойчивость картины стоит на этой одной опоре.
  #
  # МЕДИЦИНА. Нерегулярные списания FBTO — это анализы и процедуры, а не
  # страховка (страховка = ровно 158,35 первого числа). MijnPil возвращается
  # по страховке и в итог не входит. EchoPlus 216 — это УЗИ.
  # Регулярная медицина 133/мес; разовые 853 исключены по указанию владелицы.
  # Практический вывод: добровольную франшизу не брать.
  #
  # ПОДПИСКИ. Anthropic + Lenny's (119/мес) — деловые расходы ZZP.
  # Нулевые триалы (DeepL, ElevenLabs, Supabase, Mobbin, Wispr, Google)
  # владелица отменяет, в расходы не заложены.
  #
  # ЗАНЯТИЯ ГОЛЛАНДСКИМ (Meelker, H&R Education, Michelle Egbers) —
  # ДЕЛОВОЙ расход, в личные не входит.
  #
  # ВОЗВРАТ ОТ МАМЫ — разовый, ~500 EUR один раз за расходы в Турции.
  # На месячную норму не влияет.
  total: 2980

# Текущий размер подушки безопасности (отдельно от резерва под просадки!).
# По данным владелицы 05.07.2026: около 20 000 (может, чуть больше),
# половина наличными, половина в банке.
#
# ОСТАТКИ на 02.08.2026 (по данным владелицы):
#   Direct Savings (ABN)     17 590
#   накопительный, др. банк  10 000
#   деловой счёт              8 005
#   личный счёт               3 577
#   ИТОГО                    39 172
#
# Расхождение прошлого расчёта снято: перевод −15 000 на Direct Savings
# 30.12.2025 — это НЕ отложенный за год доход, а перемещение уже имевшихся
# денег (вывод из Van Lanschot Kempen). Реально за год отложено
# 7 000 + 7 900 = 14 900, что сходится со свободным потоком.
#
# К июню 2027 надо иметь 29 241 на налог, из них ~10 000 придёт доплатой
# в тот же месяц -> накопить самой ~19 200.
#   39 172 на счетах − 19 200 = 19 972 подушки при цели 17 100.
# Излишек ~2 900. Прежняя оценка "излишек 18 000" была ошибкой:
# она опиралась на налог прошлого года.
emergency_fund_current: 19972

# Целевой размер подушки в месяцах расходов.
emergency_fund_months_target: 6

# Текущий ежемесячный взнос в инвестиции — для сравнения с рекомендацией.
current_monthly_investment: 2700

