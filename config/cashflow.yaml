# ОСТАТКИ на 02.08.2026 (по данным владелицы):
#   Direct Savings (ABN)     17 590
#   накопительный, др. банк  10 000
#   деловой счёт              8 005
#   личный счёт               3 577
#   ИТОГО                    39 172
#
# Расхождение прошлого расчёта снято: перевод −15 000 на Direct Savings
# 30.12.2025 — это НЕ отложенный за год доход, а перемещение уже имевшихся
# денег (вывод из Van Lanschot Kempen). Реально за год отложено
# 7 000 + 7 900 = 14 900, что сходится со свободным потоком.
#
# РЕЗЕРВ ПОД НАЛОГ — механика компенсации от клиента.
# Регулярные 3 500 x 2 идут С НАЛОГОМ ВНУТРИ (заложена примерная сумма),
# а остаток клиент доплачивает отдельным платежом в июне-июле. Компенсация
# рассчитана С УЧЁТОМ налога на саму компенсацию, то есть с запасом.
#
# ЧТО КЛИЕНТ КОМПЕНСИРУЕТ, А ЧТО НЕТ:
#   Box 1 + ZVW с гонорара            30 957  -> компенсирует
#   Box 3 на капитал (оценка 2026)    ~2 500  -> НЕ компенсирует, это её
#                                                 налог на её же капитал
#   ИТОГО годовое начисление         ~33 500
#
# Компенсация сама по себе тоже выручка и тоже облагается — она уже
# сидит внутри 105 236, двойного счёта нет.
#
# ФОРМУЛА КОМПЕНСАЦИИ (подтверждена владелицей, август 2026):
#   компенсация = ФАКТИЧЕСКИЙ налог − налог, ЗАЛОЖЕННЫЙ в месячные выплаты
# Заложено Z = 30 957 − 7 633 = 23 324/год = 1 944/мес.
#
# ГЛАВНОЕ СЛЕДСТВИЕ. Подставим C = T − Z в кассу:
#   касса = выручка − налог − деловые = (97 603 + T − Z) − T − E
#         = 97 603 − Z − E                   <- от T НЕ ЗАВИСИТ ВООБЩЕ
# Проверено численно (решением неподвижной точки, tools/verify.py):
#   lijfrente 0      -> налог 30 956, компенсация 7 632, касса 62 844
#   lijfrente 6 000  -> налог 26 344, компенсация 3 020, касса 62 844
#   lijfrente 19 350 -> налог 15 879, компенсация    0,  касса 67 013
#
# То есть КЛИЕНТ ПОГЛОЩАЕТ 100 % ПРЕДЕЛЬНОГО НАЛОГА, пока компенсация
# положительна. Отсюда переворачиваются три прежних вывода:
#   1. Заявить уже понесённые деловые расходы (620-768/год) даёт ЕЙ НОЛЬ:
#      налог падает — компенсация падает на столько же. KIA тоже ноль.
#   2. Деловой расход стоит не 51 цент с евро, а ПОЛНЫЙ евро.
#   3. Пропуск психолога на 1 200 освобождает ВСЕ 1 200, а не 613:
#      доплату 587 заплатит клиент, а не она.
#
# ПОРОГ. Компенсация обнуляется, когда фактический налог опускается до Z.
# Это происходит при lijfrente ~9 900/год. ВЫШЕ этого порога вычет снова
# работает на неё, по 43,9 % с евро (клиент деньги назад не требует).
# Поэтому оптимум взноса в lijfrente — 10 000-14 400/год, а не 6 000.
#
# ЧТО СТОИТ СДЕЛАТЬ БЕСПЛАТНО: письменного договора нет, есть переписка
# «компенсируем налоги» без деталей. Переформулировать на «компенсируете
# налог с гонорара, посчитанный ДО моих личных пенсионных вычетов» —
# это вернуло бы 2 582/год и заодно зафиксировало бы саму договорённость.
#
# ЧТО СПРОСИТЬ: смотрит ли клиент на итоговое начисление целиком. Если да,
# в нём сидит и Box 3 (~2 471/год), и тогда его тоже компенсируют.
#
# ПОЛОЖЕНИЕ НА 1 АВГУСТА 2026 (по начислению, 7 месяцев из 12):
#   начислено Box 1 + ZVW  7/12 x 30 957                      18 058
#   начислено Box 3        7/12 x 2 471                        1 442
#   = начислено всего                                         19 500
#   отнесено на резерв (39 172 − 19 972)                      19 200
#   -> отставание                                               −300
# То есть резерв идёт вровень: опережение по Box 1 съедено Box 3.
#
# BELASTINGRENTE. Voorlopige aangifte владелица НЕ подаёт — налог уходит
# одним платежом по итоговому начислению. Тогда работает правило: если
# декларация подана ДО 1 МАЯ следующего года и начисление идёт по ней,
# belastingrente не начисляется. Если позже — проценты бегут с 1 июля
# на всю сумму. На ~33 500 это порядка 500-1 500 за несколько месяцев.
# Практический вывод: декларацию за 2026 подать до 1 мая 2027. Стоит ноль.
#   39 172 на счетах − 19 200 = 19 972 подушки при цели 17 880.
