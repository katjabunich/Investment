# ============================================================================
# Конфигурация денежного потока (доходы/расходы) для советника по взносам
# ============================================================================
# Файл читает tools/cashflow.py и на основе этих данных считает свободный
# денежный поток, норму сбережений, заполненность подушки безопасности и
# выдаёт рекомендацию по ежемесячному инвестиционному взносу.
#
# Все суммы указывайте в одной валюте (той же, что и в config/portfolio.yaml).
# Для быстрой прикидки без правки этого файла используйте флаги
# --income и --expenses у tools/cashflow.py.
# ----------------------------------------------------------------------------

# Чистый ежемесячный доход (после налогов). ПЛЕЙСХОЛДЕР — замените на свой.
monthly_income_net: 5000

# Стабильность дохода:
#   stable   — фиксированная зарплата, доход предсказуем месяц в месяц
#   variable — фриланс, сдельная работа, нерегулярные бонусы
# Влияет на консервативность рекомендаций: при variable буфер на
# непредвиденное больше (20% вместо 10%), а подушка безопасности
# наполняется в приоритетном порядке.
income_stability: stable

# Ежемесячные расходы. Можно указать по категориям (словарь) — тогда сумма
# посчитается автоматически, либо одним числом через ключ total.
monthly_expenses:
  жильё: 1500
  еда: 600
  транспорт: 300
  прочее: 600
  # Альтернатива: одна общая сумма вместо категорий (раскомментируйте
  # и удалите категории выше, если не хотите вести разбивку по статьям):
  # total: 3000

# Текущий размер подушки безопасности (сколько уже отложено на счёте/вкладе).
emergency_fund_current: 10000

# Целевой размер подушки в месяцах расходов (обычно рекомендуют 3-6 месяцев).
emergency_fund_months_target: 6

# Текущий ежемесячный взнос в инвестиции — нужен для сравнения с
# рекомендацией ("можно увеличить" / "стоит уменьшить").
current_monthly_investment: 1000

# Крупные плановые расходы в обозримом будущем (отпуск, машина, ремонт и т.п.).
# months_until — через сколько месяцев понадобится сумма amount. Под каждую
# такую трату советник резервирует amount/months_until в месяц уже сейчас,
# чтобы не залезать в подушку и не продавать инвестиции в последний момент.
planned_large_expenses:
  - name: отпуск
    amount: 2000
    months_until: 8
  - name: машина
    amount: 6000
    months_until: 18
